name: Refresh Apify usage data

on:
  schedule:
    - cron: "17 13 * * *"  # ~9:17am ET daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live Apify usage
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/fetch_usage.py

      - name: Commit if changed
        run: |
          git config user.name "usage-bot"
          git config user.email "usage-bot@users.noreply.github.com"
          git add usage-data.json
          if git diff --cached --quiet; then
            echo "No usage change."
          else
            git commit -m "Refresh Apify usage data [skip ci]"
            git push
          fi
